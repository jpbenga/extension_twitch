<!DOCTYPE html>

<html class="dark" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AFTER — Player Current Turn — Mobile — v1</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0C0C1F',
            surface: {
              DEFAULT: '#1A1A2D',
              raised: '#28283C',
              high: '#32324A',
            },
            text: {
              primary: '#E2E0FB',
              secondary: '#B7A8D4',
            },
            lilac: '#CEBDFF',
            citron: '#C8F323',
            'citron-text': '#171E00',
            control: {
              border: '#7E7199',
            }
          },
          fontFamily: {
            heading: ['"Space Grotesk"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #0C0C1F;
      color: #E2E0FB;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0C0C1F] text-[#E2E0FB] min-h-screen flex flex-col justify-between items-center selection:bg-[#CEBDFF] selection:text-[#0C0C1F]">
<!-- Mobile screen container (390px responsive measure, 16px margins, no outer device frame) -->
<main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between px-4 py-4 sm:py-6">
<!-- Header -->
<header class="w-full flex items-center justify-between py-2 border-b border-[#28283C]/60 mb-6">
<div class="flex items-center gap-2">
<svg aria-hidden="true" class="w-5 h-5 text-[#CEBDFF]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="12" rx="4" width="20" x="2" y="6"></rect>
<line x1="6" x2="10" y1="12" y2="12"></line>
<line x1="8" x2="8" y1="10" y2="14"></line>
<circle cx="15" cy="13" r="1"></circle>
<circle cx="18" cy="11" r="1"></circle>
</svg>
<span class="font-heading font-bold text-sm tracking-wide uppercase text-[#E2E0FB]">Undercover</span>
</div>
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#1A1A2D] border border-[#28283C] text-xs">
<span aria-hidden="true" class="w-2 h-2 rounded-full bg-[#C8F323]"></span>
<span class="font-heading font-medium text-[#E2E0FB]">Camille</span>
</div>
</header>
<!-- Content Center -->
<div class="w-full flex-1 flex flex-col justify-center gap-5 my-auto">
<!-- Phase / Round Pill Banner -->
<div class="w-full flex justify-center">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#1A1A2D] border border-[#28283C] text-xs text-[#B7A8D4]">
<span class="font-heading tracking-wide uppercase">Manche 1 · Tour d’indices 1 sur 2</span>
</div>
</div>
<!-- Main Turn Instruction Card -->
<section class="w-full bg-[#1A1A2D] border border-[#28283C] rounded-[12px] p-6 text-center flex flex-col items-center">
<!-- Turn indicator badge / icon -->
<div aria-hidden="true" class="w-12 h-12 rounded-full bg-[#28283C] flex items-center justify-center text-[#C8F323] mb-4">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<h1 class="font-heading text-2xl font-bold text-[#E2E0FB] tracking-tight mb-2">
          À vous de jouer
        </h1>
<p class="font-heading text-base font-medium text-[#CEBDFF] mb-2 leading-snug max-w-[280px]">
          Donnez votre indice à voix haute.
        </p>
<p class="text-xs text-[#B7A8D4] leading-relaxed max-w-[270px]">
          Le Game Master confirme votre passage.
        </p>
</section>
<!-- Discreet Word Concealment State Bar -->
<section class="w-full bg-[#1A1A2D] border border-[#28283C] rounded-[12px] px-4 py-3.5 flex items-center justify-between gap-3">
<div class="flex items-center gap-2.5 min-w-0">
<svg aria-hidden="true" class="w-4 h-4 text-[#B7A8D4] shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
<path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
<line x1="2" x2="22" y1="2" y2="22"></line>
</svg>
<span class="text-xs text-[#B7A8D4] truncate font-medium">Votre mot est masqué</span>
</div>
<button class="shrink-0 h-12 min-h-[48px] px-3.5 rounded-[8px] bg-[#28283C] hover:bg-[#32324A] text-[#CEBDFF] hover:text-[#E2E0FB] border border-[#7E7199]/40 text-xs font-heading font-medium inline-flex items-center gap-1.5 transition-colors touch-manipulation" type="button"><svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>Voir mon mot</span></button>
</section>
</div>
<!-- Bottom Secondary Disclosure -->
<footer class="w-full mt-6 pb-2">
<button class="w-full min-h-[48px] h-12 py-3 px-4 rounded-[12px] bg-[#1A1A2D] hover:bg-[#28283C] border border-[#28283C] text-xs text-[#B7A8D4] hover:text-[#E2E0FB] flex items-center justify-between transition-colors touch-manipulation font-body" type="button"><span class="inline-flex items-center gap-2 font-medium"><svg aria-hidden="true" class="w-4 h-4 text-[#B7A8D4]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Suivre la partie</span><svg aria-hidden="true" class="w-4 h-4 text-[#B7A8D4]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
</footer>
</main>
</body>
</html>
