<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFTER — Player Defeat — Mobile — v1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0C0C1F',
            surface: {
              DEFAULT: '#1A1A2D',
              raised: '#28283C'
            },
            txt: {
              primary: '#E2E0FB',
              secondary: '#B7A8D4'
            },
            lilac: '#CEBDFF',
            citron: {
              DEFAULT: '#C8F323',
              dark: '#171E00'
            },
            border: '#7E7199'
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif']
          },
          borderRadius: {
            card: '12px',
            control: '8px'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0C0C1F;
      color: #E2E0FB;
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-canvas text-txt-primary flex flex-col justify-between p-4 selection:bg-lilac selection:text-surface">
  <main class="w-full max-w-[390px] mx-auto flex flex-col flex-1 justify-between gap-6 py-2">
    <!-- Header -->
    <header class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-txt-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="4"></rect>
          <path d="M6 12h4m-2-2v4"></path>
          <line x1="15" y1="11" x2="15.01" y2="11"></line>
          <line x1="18" y1="13" x2="18.01" y2="13"></line>
        </svg>
        <span class="font-display font-bold text-sm tracking-wider uppercase">UNDERCOVER</span>
      </div>

      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface text-txt-secondary text-xs font-display border border-surface-raised">
        <span class="text-txt-secondary">Joueur</span>
        <span class="text-txt-primary font-medium">Camille</span>
      </div>
    </header>

    <!-- Main Result Card Area -->
    <div class="flex flex-col items-center justify-center gap-4 my-auto">
      <!-- Round / End status pill -->
      <div class="px-3.5 py-1 rounded-full bg-surface text-txt-secondary text-xs font-display border border-surface-raised tracking-wide">
        Fin de partie
      </div>

      <!-- Main Result Card -->
      <section class="w-full bg-surface border border-surface-raised rounded-card p-6 flex flex-col items-center text-center">
        <!-- Icon Badge (No harsh red panel, calm game identity) -->
        <div class="w-12 h-12 rounded-full bg-surface-raised flex items-center justify-center mb-4 text-txt-secondary border border-border/30">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9 15c.5-.8 1.5-1.2 3-1.2s2.5.4 3 1.2"></path>
            <line x1="9" y1="9.5" x2="9.01" y2="9.5" stroke-width="2.5"></line>
            <line x1="15" y1="9.5" x2="15.01" y2="9.5" stroke-width="2.5"></line>
          </svg>
        </div>

        <!-- Main Outcome Title -->
        <h1 class="font-display font-bold text-2xl text-txt-primary tracking-tight mb-1">
          Vous avez perdu
        </h1>

        <!-- Global Outcome Subtitle -->
        <p class="font-display font-medium text-base text-lilac mb-3">
          Victoire des Undercover
        </p>

        <!-- Player revealed camp badge -->
        <div class="inline-flex items-center px-3 py-1 rounded-full bg-surface-raised/70 border border-surface-raised text-xs text-txt-secondary font-display mb-6">
          <span>Votre camp : <strong class="text-txt-primary font-semibold">Civil</strong></span>
        </div>

        <!-- Authorized Reveal of Words -->
        <div class="w-full pt-5 border-t border-surface-raised flex flex-col gap-2.5">
          <span class="text-[11px] font-display uppercase tracking-wider text-txt-secondary">
            Mots secrets de la partie
          </span>

          <div class="grid grid-cols-2 gap-2.5 w-full">
            <div class="bg-canvas/60 rounded-control p-2.5 border border-surface-raised/60 flex flex-col items-center">
              <span class="text-[11px] text-txt-secondary font-display">Civils</span>
              <span class="font-display font-bold text-sm text-txt-primary mt-0.5">Phare</span>
            </div>
            <div class="bg-canvas/60 rounded-control p-2.5 border border-surface-raised/60 flex flex-col items-center">
              <span class="text-[11px] text-lilac font-display">Undercover</span>
              <span class="font-display font-bold text-sm text-txt-primary mt-0.5">Fusée</span>
            </div>
          </div>
        </div>

        <!-- Quiet status text -->
        <p class="text-xs text-txt-secondary mt-5 leading-relaxed font-sans">
          Le Game Master peut préparer une nouvelle partie.
        </p>
      </section>
    </div>

    <!-- Bottom Secondary Disclosures -->
    <footer class="w-full flex flex-col gap-2 pb-2">
      <!-- Closed "Voir les joueurs" accordion / disclosure -->
      <button type="button" class="w-full min-h-[44px] px-4 py-2.5 rounded-control bg-surface border border-surface-raised flex items-center justify-between text-left text-xs font-display text-txt-primary hover:bg-surface-raised/60 transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-txt-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Voir les joueurs</span>
        </div>
        <svg class="w-4 h-4 text-txt-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Closed "Suivre la partie" accordion / disclosure -->
      <button type="button" class="w-full min-h-[44px] px-4 py-2.5 rounded-control bg-surface border border-surface-raised flex items-center justify-between text-left text-xs font-display text-txt-primary hover:bg-surface-raised/60 transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-txt-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Suivre la partie</span>
        </div>
        <svg class="w-4 h-4 text-txt-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </footer>
  </main>
</body>
</html>
