<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AFTER — Player Vote Submitted — Mobile — v1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0C0C1F',
            surface: {
              DEFAULT: '#1A1A2D',
              raised: '#28283C',
              high: '#202035',
            },
            content: {
              primary: '#E2E0FB',
              secondary: '#B7A8D4',
              muted: '#7E7199',
            },
            accent: {
              lilac: '#CEBDFF',
              citron: '#C8F323',
              'citron-text': '#171E00',
            },
            control: {
              border: '#7E7199',
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
          borderRadius: {
            'card': '12px',
            'control': '8px',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0C0C1F;
      color: #E2E0FB;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0C0C1F] text-[#E2E0FB] flex flex-col justify-between selection:bg-[#CEBDFF]/20">
  <div class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col justify-between px-4 py-5">
    
    <!-- Top Header & Status -->
    <header class="w-full flex flex-col gap-5">
      <!-- App Header: Compact minimal brand mark & player badge -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <!-- Gamepad icon -->
          <svg class="w-5 h-5 text-[#CEBDFF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="4" />
            <path d="M6 12h4" />
            <path d="M8 10v4" />
            <line x1="15" y1="13" x2="15.01" y2="13" stroke-width="2.5" />
            <line x1="18" y1="11" x2="18.01" y2="11" stroke-width="2.5" />
          </svg>
          <span class="font-display font-bold text-sm tracking-wider uppercase text-[#E2E0FB]">Undercover</span>
        </div>

        <!-- Player identity pill -->
        <div class="flex items-center gap-2 bg-[#1A1A2D] border border-[#7E7199]/40 rounded-full px-3 py-1">
          <span class="w-2 h-2 rounded-full bg-[#C8F323]" aria-hidden="true"></span>
          <span class="text-xs font-medium text-[#E2E0FB]">Camille</span>
        </div>
      </div>

      <!-- Phase badge: neutral, restrained -->
      <div class="flex justify-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#1A1A2D]/80 border border-[#7E7199]/30 text-xs font-medium text-[#B7A8D4]">
          <span>Manche 1 · Vote des joueurs</span>
        </div>
      </div>
    </header>

    <!-- Main Content: Submitted Vote Confirmation Card -->
    <main class="w-full flex flex-col items-center my-auto py-6">
      <div class="w-full bg-[#1A1A2D] border border-[#7E7199]/40 rounded-[12px] p-6 flex flex-col items-center text-center">
        
        <!-- Quiet check icon container -->
        <div class="w-12 h-12 rounded-full bg-[#28283C] border border-[#7E7199]/50 flex items-center justify-center mb-4">
          <svg class="w-6 h-6 text-[#CEBDFF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <!-- Title -->
        <h1 class="font-display font-semibold text-xl text-[#E2E0FB] tracking-tight mb-2">
          Vote enregistré
        </h1>

        <!-- Confirmed vote details -->
        <p class="text-base text-[#E2E0FB] mb-1">
          Vous avez voté pour <span class="font-display font-semibold text-[#CEBDFF]">Léa</span>.
        </p>

        <!-- Subtitle waiting message -->
        <p class="text-sm text-[#B7A8D4] mb-6">
          En attente du résultat.
        </p>

        <!-- Real collective participation counter (no candidate tallies) -->
        <div class="w-full pt-4 border-t border-[#7E7199]/25 flex items-center justify-center gap-2">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#CEBDFF]/70"></span>
          <span class="text-xs font-medium text-[#B7A8D4] tracking-wide">
            3 votes reçus sur 4
          </span>
        </div>
      </div>

      <!-- Secret Word Conceal / Reveal Access Bar -->
      <div class="w-full mt-4 bg-[#1A1A2D] border border-[#7E7199]/40 rounded-[12px] p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5 pl-1.5">
          <svg class="w-4 h-4 text-[#B7A8D4]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <span class="text-xs text-[#B7A8D4]">Votre mot est masqué</span>
        </div>
        <button type="button" class="inline-flex items-center gap-1.5 px-3 py-2 min-h-[44px] rounded-[8px] bg-[#28283C] hover:bg-[#28283C]/80 active:bg-[#28283C]/60 border border-[#7E7199]/40 text-xs font-display font-medium text-[#E2E0FB] transition-colors">
          <svg class="w-3.5 h-3.5 text-[#B7A8D4]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Voir mon mot</span>
        </button>
      </div>
    </main>

    <!-- Bottom Collapsible Game Tracking Section (Suivre la partie) -->
    <footer class="w-full pb-2">
      <div class="w-full bg-[#1A1A2D] border border-[#7E7199]/40 rounded-[12px] overflow-hidden">
        <button type="button" class="w-full min-h-[44px] px-4 py-3 flex items-center justify-between text-left hover:bg-[#28283C]/50 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-[#B7A8D4]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span class="text-xs font-display font-medium text-[#B7A8D4]">Suivre la partie</span>
          </div>
          <svg class="w-4 h-4 text-[#B7A8D4]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
    </footer>

  </div>
</body>
</html>
