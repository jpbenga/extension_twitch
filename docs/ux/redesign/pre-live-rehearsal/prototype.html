<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Répétition avant direct — Prototype UX</title>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/spacegrotesk.ttf") format("truetype"); font-display: swap; }
      @font-face { font-family: "DM Sans"; src: url("assets/dmsans.ttf") format("truetype"); font-display: swap; }
      :root {
        --ink: #0a091c;
        --ink-2: #111027;
        --surface: #18162e;
        --surface-2: #211e3b;
        --line: rgba(219, 211, 255, .16);
        --line-strong: rgba(219, 211, 255, .28);
        --text: #f4f1ff;
        --muted: #aaa4c1;
        --lilac: #c9b9ff;
        --violet: #7c5cff;
        --citron: #c5f719;
        --citron-ink: #162000;
        --danger: #ff8d9b;
        --warning: #ffc866;
        --ok: #99ecb3;
        --r-sm: 12px;
        --r-md: 16px;
        --r-lg: 24px;
        --shadow: 0 24px 70px rgba(2, 1, 14, .38);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); }
      body { font-family: "DM Sans", system-ui, sans-serif; letter-spacing: -.01em; }
      button, input { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      .app { min-height: 100vh; background:
        radial-gradient(circle at 14% -10%, rgba(124, 92, 255, .15), transparent 30rem),
        linear-gradient(180deg, #0b0a1e 0%, #090819 100%); }
      .topbar { height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.05); background: rgba(9,8,25,.76); backdrop-filter: blur(18px); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-family: "Space Grotesk"; font-size: 19px; font-weight: 700; letter-spacing: .01em; }
      .brand-mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--citron); border: 1px solid var(--line-strong); background: linear-gradient(145deg, #242142, #121125); }
      .brand-mark svg { width: 18px; height: 18px; }
      .top-actions { display: flex; align-items: center; gap: 10px; }
      .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--lilac); font-weight: 800; font-size: 12px; }
      .container { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 72px; }
      .container.narrow { width: min(960px, calc(100% - 48px)); }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--lilac); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
      .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--citron); box-shadow: 0 0 0 5px rgba(197,247,25,.08); }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3 { font-family: "Space Grotesk"; letter-spacing: -.035em; }
      h1 { margin-bottom: 13px; font-size: clamp(34px, 4vw, 54px); line-height: 1.02; }
      h2 { margin-bottom: 9px; font-size: 28px; line-height: 1.1; }
      h3 { margin-bottom: 6px; font-size: 17px; line-height: 1.2; }
      p { color: var(--muted); line-height: 1.55; }
      .lead { max-width: 620px; font-size: 17px; }
      .back { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 30px; }
      .back svg { width: 16px; height: 16px; flex: 0 0 auto; }
      .back:hover { color: var(--text); }
      .hero-row { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 34px; }
      .hero-row p { margin-bottom: 0; }
      .btn { min-height: 48px; border-radius: var(--r-sm); padding: 0 19px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); display: inline-flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
      .btn:hover { transform: translateY(-1px); border-color: rgba(219,211,255,.48); }
      .btn.primary { background: var(--citron); border-color: var(--citron); color: var(--citron-ink); box-shadow: 0 10px 34px rgba(197,247,25,.15); }
      .btn.primary:hover { background: #d2ff31; }
      .btn.ghost { background: transparent; }
      .btn.linkish { background: transparent; border-color: transparent; color: var(--lilac); padding-inline: 8px; }
      .btn.small { min-height: 40px; padding: 0 14px; font-size: 13px; }
      .btn svg { width: 17px; height: 17px; stroke-width: 2; }
      .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .card { border: 1px solid var(--line); border-radius: var(--r-md); background: linear-gradient(145deg, rgba(31,28,58,.92), rgba(19,18,40,.96)); box-shadow: var(--shadow); }
      .ready-grid { display: grid; grid-template-columns: 1.5fr .82fr; gap: 20px; align-items: stretch; }
      .ready-list { padding: 26px; }
      .ready-head { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
      .pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; font-weight: 800; font-size: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--lilac); white-space: nowrap; }
      .pill.ok { color: var(--ok); border-color: rgba(153,236,179,.25); background: rgba(153,236,179,.07); }
      .pill.citron { color: var(--citron); border-color: rgba(197,247,25,.24); background: rgba(197,247,25,.07); }
      .match-list { display: grid; gap: 10px; }
      .match { min-height: 68px; padding: 0 16px; border: 1px solid rgba(255,255,255,.07); border-radius: var(--r-sm); display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 14px; background: rgba(255,255,255,.025); }
      .match-index { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #292548; color: var(--lilac); font-family: "Space Grotesk"; font-weight: 800; }
      .match strong { font-family: "Space Grotesk"; }
      .match small { display: block; margin-top: 3px; color: var(--muted); }
      .side-cta { padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px; border-color: rgba(197,247,25,.22); background: radial-gradient(circle at 100% 0%, rgba(197,247,25,.08), transparent 60%), linear-gradient(145deg, rgba(31,28,58,.96), rgba(19,18,40,.98)); }
      .side-cta .icon-orb { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: rgba(197,247,25,.1); border: 1px solid rgba(197,247,25,.23); color: var(--citron); }
      .side-cta .icon-orb svg { width: 23px; height: 23px; }
      .side-cta p { margin-bottom: 0; }
      .side-cta .btn { width: 100%; }
      .reassurance { display: flex; align-items: flex-start; gap: 10px; color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 14px; }
      .reassurance svg { width: 16px; min-width: 16px; color: var(--ok); }
      .mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 34px 0 22px; }
      .mode { min-height: 292px; padding: 27px; position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; color: var(--text); overflow: hidden; }
      .mode.recommended { border-color: rgba(197,247,25,.35); }
      .mode.recommended::after { content: "Recommandé"; position: absolute; top: 18px; right: 18px; padding: 7px 10px; border-radius: 999px; background: rgba(197,247,25,.1); border: 1px solid rgba(197,247,25,.2); color: var(--citron); font-size: 11px; font-weight: 800; }
      .mode-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 40px; background: rgba(201,185,255,.1); border: 1px solid rgba(201,185,255,.2); color: var(--lilac); }
      .mode-icon svg { width: 23px; height: 23px; }
      .mode h2 { margin-bottom: 10px; }
      .mode p { max-width: 370px; margin-bottom: 25px; }
      .mode .btn { margin-top: auto; }
      .prep-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--line); overflow: hidden; }
      .prep-item { background: var(--surface); padding: 17px 18px; min-height: 80px; }
      .prep-item small { color: var(--muted); display: block; margin-bottom: 7px; }
      .prep-item strong { font-family: "Space Grotesk"; font-size: 14px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--ok); box-shadow: 0 0 0 5px rgba(153,236,179,.07); }
      .status-dot.pending { background: var(--warning); box-shadow: 0 0 0 5px rgba(255,200,102,.07); }
      .mobile-secondary { display: none; }

      /* Central rehearsal scene */
      .scene-shell { min-height: 100vh; background: #060611; }
      .scene-nav { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid rgba(255,255,255,.08); background: #0a091a; }
      .scene-nav .title { display: flex; align-items: center; gap: 12px; font-family: "Space Grotesk"; font-weight: 800; }
      .live-tag { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(201,185,255,.09); color: var(--lilac); border: 1px solid rgba(201,185,255,.17); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      .scene-layout { display: grid; grid-template-columns: minmax(0, 1fr) 304px; min-height: calc(100vh - 64px); }
      .stage-area { padding: 24px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
      .stage { position: relative; aspect-ratio: 16 / 9; width: 100%; max-height: calc(100vh - 152px); margin: 0 auto; overflow: hidden; border-radius: var(--r-md); background: radial-gradient(circle at 50% 50%, #27233f, #0d0c18 64%); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 25px 80px rgba(0,0,0,.5); }
      .stage.with-camera { background: #111; }
      .camera-feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) contrast(1.03) brightness(.78); }
      .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6,5,20,.32), transparent 22%, transparent 65%, rgba(5,4,18,.5)); }
      .camera-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 2; }
      .camera-empty .empty-orb { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 20px; display: grid; place-items: center; background: rgba(201,185,255,.08); border: 1px solid rgba(201,185,255,.16); color: var(--lilac); }
      .camera-empty svg { width: 32px; height: 32px; }
      .camera-empty h2 { margin-bottom: 8px; }
      .camera-empty p { margin-bottom: 21px; max-width: 340px; }
      .overlay { position: absolute; inset: 0; z-index: 3; pointer-events: none; font-family: "DM Sans"; }
      .broadcast-bar { position: absolute; top: 22px; left: 22px; height: 47px; padding: 0 18px; display: flex; align-items: center; gap: 13px; border-radius: 15px; background: rgba(9,8,25,.86); border: 1px solid rgba(201,185,255,.24); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.24); font-size: 13px; }
      .broadcast-bar strong { font-family: "Space Grotesk"; letter-spacing: .01em; }
      .sep { width: 1px; height: 17px; background: rgba(255,255,255,.18); }
      .player-count { position: absolute; top: 22px; right: 22px; height: 42px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: rgba(9,8,25,.84); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(16px); font-size: 12px; }
      .player-count svg { width: 16px; }
      .duo { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; }
      .duo-card { width: 168px; height: 78px; padding: 13px 16px; border-radius: 15px; display: flex; align-items: flex-end; overflow: hidden; position: relative; background: linear-gradient(135deg, rgba(58,48,115,.92), rgba(15,13,36,.94)); border: 1px solid rgba(129,102,255,.65); box-shadow: 0 9px 28px rgba(0,0,0,.28), 0 0 20px rgba(124,92,255,.12); }
      .duo-card.red { background: linear-gradient(135deg, rgba(113,40,65,.9), rgba(23,12,30,.95)); border-color: rgba(255,111,143,.66); box-shadow: 0 9px 28px rgba(0,0,0,.28), 0 0 20px rgba(255,111,143,.1); }
      .duo-card::before { content: ""; position: absolute; width: 115px; height: 115px; border-radius: 50%; top: -58px; right: -20px; background: rgba(201,185,255,.1); border: 1px solid rgba(201,185,255,.12); }
      .duo-card span { font-family: "Space Grotesk"; font-weight: 800; font-size: 17px; position: relative; z-index: 1; }
      .vs { font-family: "Space Grotesk"; font-weight: 800; color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.6); }
      .active-player { position: absolute; left: 22px; bottom: 22px; display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 14px; border-radius: 13px; background: rgba(9,8,25,.82); border: 1px solid rgba(197,247,25,.28); backdrop-filter: blur(16px); font-size: 12px; }
      .active-player .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--citron); box-shadow: 0 0 0 5px rgba(197,247,25,.1); }
      .vote-panel { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); min-width: 410px; padding: 14px 18px; border-radius: 16px; background: rgba(9,8,25,.88); border: 1px solid rgba(201,185,255,.24); backdrop-filter: blur(18px); }
      .vote-head { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 11px; font-size: 12px; }
      .vote-head strong { font-family: "Space Grotesk"; font-size: 14px; }
      .vote-people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .vote-person { height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); font-size: 12px; }
      .scene-caption { display: flex; align-items: center; justify-content: space-between; gap: 18px; color: var(--muted); font-size: 12px; padding-inline: 3px; }
      .sync { display: inline-flex; align-items: center; gap: 9px; color: var(--ok); }
      .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 5px rgba(153,236,179,.07); }
      .rail { border-left: 1px solid rgba(255,255,255,.08); background: #0d0c20; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; }
      .rail h2 { font-size: 19px; margin-bottom: 5px; }
      .rail p { font-size: 13px; margin-bottom: 0; }
      .checklist { display: grid; gap: 7px; }
      .check { min-height: 48px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.075); border-radius: 11px; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center; background: rgba(255,255,255,.025); font-size: 12px; color: var(--muted); }
      .check-icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(153,236,179,.1); color: var(--ok); }
      .check-icon svg { width: 13px; height: 13px; }
      .check.pending .check-icon { background: rgba(201,185,255,.07); color: var(--lilac); }
      .check.warning .check-icon { background: rgba(255,200,102,.1); color: var(--warning); }
      .view-links { padding-top: 17px; border-top: 1px solid rgba(255,255,255,.08); display: grid; gap: 3px; }
      .view-link { min-height: 38px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); text-decoration: none; font-size: 12px; border-radius: 9px; padding: 0 8px; }
      .view-link svg { width: 15px; height: 15px; flex: 0 0 auto; }
      .view-link:hover { color: var(--text); background: rgba(255,255,255,.04); }
      .rail-actions { margin-top: auto; display: grid; gap: 8px; }
      .rail-actions .btn { width: 100%; }

      /* Issue / complete */
      .center-card { max-width: 740px; margin: 56px auto 0; padding: 34px; }
      .signal { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; margin-bottom: 25px; color: var(--warning); background: rgba(255,200,102,.08); border: 1px solid rgba(255,200,102,.2); }
      .signal.success { color: var(--citron); background: rgba(197,247,25,.08); border-color: rgba(197,247,25,.2); }
      .signal svg { width: 26px; height: 26px; }
      .issue-row { margin: 27px 0; padding: 17px; border-radius: var(--r-sm); border: 1px solid rgba(255,200,102,.17); background: rgba(255,200,102,.045); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
      .issue-row strong { display: block; font-family: "Space Grotesk"; margin-bottom: 3px; }
      .issue-row small { color: var(--muted); }
      .complete-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 28px 0 30px; }
      .complete-item { padding: 15px; min-height: 67px; border-radius: 12px; border: 1px solid rgba(153,236,179,.13); background: rgba(153,236,179,.035); display: flex; align-items: center; gap: 11px; font-size: 13px; }
      .complete-item svg { width: 18px; min-width: 18px; color: var(--ok); }
      .preserved { padding: 14px 16px; border-radius: 12px; background: rgba(201,185,255,.06); color: var(--lilac); border: 1px solid rgba(201,185,255,.14); font-size: 13px; margin-bottom: 28px; }

      /* Twitch status */
      .mobile-wrap { width: 390px; min-height: 844px; margin: 0 auto; background: linear-gradient(180deg, #0d0b24, #090819); position: relative; overflow: hidden; }
      .mobile-bar { height: 60px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.06); }
      .mobile-bar .brand { font-size: 16px; gap: 9px; }
      .mobile-bar .brand-mark { width: 30px; height: 30px; }
      .mobile-content { padding: 28px 18px 104px; }
      .mobile-content .back { margin-bottom: 24px; }
      .mobile-content h1 { font-size: 34px; }
      .mobile-content .lead { font-size: 15px; }
      .mobile-bottom { position: fixed; bottom: 0; left: 50%; width: 390px; transform: translateX(-50%); padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.08); background: rgba(9,8,25,.93); backdrop-filter: blur(20px); z-index: 9; }
      .mobile-bottom .btn { width: 100%; }
      .status-card { margin-top: 30px; padding: 24px; text-align: center; }
      .service-icon { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(145deg, #7450d5, #4b329b); box-shadow: 0 14px 38px rgba(124,92,255,.22); }
      .service-icon svg { width: 30px; height: 30px; }
      .status-card h2 { font-size: 23px; }
      .status-card p { font-size: 14px; }
      .account { margin: 22px 0 18px; padding: 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-align: left; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
      .account .avatar { flex: 0 0 auto; }
      .account strong, .account small { display: block; }
      .account small { margin-top: 2px; color: var(--ok); }
      .fineprint { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
      .mini-features { display: grid; gap: 10px; margin-top: 24px; }
      .mini-feature { display: flex; align-items: flex-start; gap: 11px; padding: 13px; border-radius: 11px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.07); color: var(--muted); font-size: 13px; line-height: 1.4; }
      .mini-feature svg { width: 18px; min-width: 18px; color: var(--lilac); }

      /* Mobile variants */
      body.is-mobile { background: #181818; }
      body.is-mobile .app { width: 390px; min-height: 844px; margin: 0 auto; position: relative; overflow: hidden; }
      body.is-mobile .topbar { height: 60px; padding: 0 18px; }
      body.is-mobile .topbar .brand { font-size: 16px; }
      body.is-mobile .top-actions .avatar { display: none; }
      body.is-mobile .container { width: auto; margin: 0; padding: 26px 18px 112px; }
      body.is-mobile .back { margin-bottom: 22px; }
      body.is-mobile h1 { font-size: 34px; }
      body.is-mobile h2 { font-size: 23px; }
      body.is-mobile .lead { font-size: 15px; }
      body.is-mobile .hero-row { display: block; margin-bottom: 24px; }
      body.is-mobile .ready-grid { display: block; }
      body.is-mobile .ready-list { padding: 16px; box-shadow: none; }
      body.is-mobile .ready-head { display: block; }
      body.is-mobile .ready-head .pill { margin-top: 10px; }
      body.is-mobile .match-list { gap: 8px; }
      body.is-mobile .match { min-height: 56px; grid-template-columns: 34px 1fr; }
      body.is-mobile .match .pill { display: none; }
      body.is-mobile .side-cta { position: fixed; left: 50%; right: auto; width: 390px; transform: translateX(-50%); bottom: 0; padding: 13px 18px calc(13px + env(safe-area-inset-bottom)); border: 0; border-top: 1px solid rgba(255,255,255,.08); border-radius: 0; background: rgba(9,8,25,.95); backdrop-filter: blur(20px); box-shadow: none; z-index: 9; }
      body.is-mobile .side-cta > div:first-child, body.is-mobile .side-cta .reassurance, body.is-mobile .side-cta .btn.ghost { display: none; }
      body.is-mobile .side-cta .actions { display: block; }
      body.is-mobile .mobile-secondary { display: grid; gap: 12px; margin: 18px 0 12px; }
      body.is-mobile .mobile-secondary .btn { width: 100%; }
      body.is-mobile .mobile-secondary .reassurance { margin: 0; padding: 12px 13px; border: 1px solid rgba(153,236,179,.13); border-radius: 11px; background: rgba(153,236,179,.035); }
      body.is-mobile .mode-grid { grid-template-columns: 1fr; margin-top: 24px; gap: 12px; }
      body.is-mobile .mode { min-height: 224px; padding: 21px; }
      body.is-mobile .mode-icon { margin-bottom: 24px; }
      body.is-mobile .prep-strip { grid-template-columns: repeat(2, 1fr); }
      body.is-mobile .prep-item { min-height: 70px; padding: 13px; }
      body.is-mobile .mode .btn { width: 100%; }
      body.is-mobile .center-card { margin: 18px 0 0; padding: 24px 20px; }
      body.is-mobile .complete-grid { grid-template-columns: 1fr; }
      body.is-mobile .center-card { padding-bottom: 104px; }
      body.is-mobile .center-card > .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: rgba(9,8,25,.95); border-top: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px); }
      body.is-mobile .center-card > .actions .btn.primary { width: 100%; }
      body.is-mobile .center-card > .actions .btn.ghost { display: none; }

      @media (max-width: 820px) {
        .ready-grid, .mode-grid { grid-template-columns: 1fr; }
        .prep-strip { grid-template-columns: repeat(2, 1fr); }
        .scene-layout { grid-template-columns: 1fr; }
        .rail { border-left: 0; border-top: 1px solid rgba(255,255,255,.08); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const icons = {
        gamepad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 8h8a5 5 0 0 1 4.6 7l-1.1 2.5a2 2 0 0 1-3.2.7l-1.6-1.4H9.3l-1.6 1.4a2 2 0 0 1-3.2-.7L3.4 15A5 5 0 0 1 8 8Z"/><path d="M7 12h4M9 10v4M16.5 11.5h.01M18.5 13.5h.01"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg>',
        left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>',
        shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>',
        spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3Z"/><path d="m19 15 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></svg>',
        users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m16 13 5 3V8l-5 3v2Z"/><rect x="3" y="6" width="13" height="12" rx="2"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/></svg>',
        alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1"/></svg>',
        cast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h20v14H7"/><path d="M2 8a9 9 0 0 1 9 9M2 13a4 4 0 0 1 4 4M2 18h.01"/></svg>',
        twitch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3h16v11l-5 5h-4l-3 3v-3H5V3Z"/><path d="M10 7v6M16 7v6"/></svg>'
      };

      const screen = new URLSearchParams(location.search).get('screen') || 'partie-ready-desktop';
      const mobileScreens = new Set(['partie-ready-mobile','mode-choice-mobile','rehearsal-complete-mobile','twitch-disconnected-mobile','twitch-connected-mobile']);
      if (mobileScreens.has(screen)) document.body.classList.add('is-mobile');

      function go(name) { location.href = '?screen=' + name; }
      function brand() { return `<a class="brand" href="?screen=partie-ready-desktop"><span class="brand-mark">${icons.gamepad}</span><span>Extension Twitch</span></a>`; }
      function topbar() { return `<header class="topbar">${brand()}<div class="top-actions"><span class="pill citron">Undercover</span><span class="avatar">CB</span></div></header>`; }
      function shell(content, cls='') { return `<div class="app">${topbar()}<main class="container ${cls}">${content}</main></div>`; }
      function back(label='Ma préparation') { return `<a class="back" href="javascript:history.back()">${icons.left}<span>${label}</span></a>`; }

      function ready() {
        return shell(`
          ${back('Mes séries')}
          <div class="hero-row"><div><span class="eyebrow"><span class="dot"></span>Série Undercover</span><h1>Ma partie Undercover</h1><p class="lead">Votre série est prête. Vérifiez-la dans les conditions du direct, sans modifier votre préparation.</p></div></div>
          <section class="ready-grid">
            <div class="card ready-list">
              <div class="ready-head"><div><h2>3 manches prêtes</h2><p>Les contenus et les images sont disponibles.</p></div><span class="pill ok">Prêt</span></div>
              <div class="match-list">
                <div class="match"><span class="match-index">1</span><div><strong>Sasuke / Itachi</strong><small>Images disponibles</small></div><span class="pill">2 tours</span></div>
                <div class="match"><span class="match-index">2</span><div><strong>Messi / Ronaldo</strong><small>Images disponibles</small></div><span class="pill">2 tours</span></div>
                <div class="match"><span class="match-index">3</span><div><strong>Paris / Londres</strong><small>Sans image</small></div><span class="pill">2 tours</span></div>
              </div>
            </div>
            <aside class="card side-cta">
              <div><span class="icon-orb">${icons.spark}</span><h2 style="margin-top:22px">Prêt à répéter ?</h2><p>Testez la régie, l’habillage TV et le rythme de votre émission.</p></div>
              <div><div class="actions"><button class="btn primary" onclick="go('${mobileScreens.has(screen) ? 'mode-choice-mobile' : 'mode-choice-desktop'}')">Tester avant le direct ${icons.arrow}</button><button class="btn ghost" onclick="go('live-lobby-handoff')">Ouvrir le salon</button></div><div class="reassurance">${icons.shield}<span>Votre série restera intacte après la répétition.</span></div></div>
            </aside>
          </section>
          <div class="mobile-secondary"><button class="btn ghost" onclick="go('live-lobby-handoff')">Ouvrir le salon</button><div class="reassurance">${icons.shield}<span>Votre série restera intacte après la répétition.</span></div></div>
        `);
      }

      function modeChoice() {
        return shell(`
          ${back('Ma partie Undercover')}
          <span class="eyebrow"><span class="dot"></span>Répétition avant direct</span>
          <h1>Comment voulez-vous répéter ?</h1>
          <p class="lead">Choisissez le format le plus utile aujourd’hui. Vous pourrez en essayer un autre plus tard.</p>
          <div class="mode-grid">
            <article class="card mode recommended"><span class="mode-icon">${icons.spark}</span><h2>Test rapide</h2><p>Vérifiez seul toute l’émission avec 3 participants de test. Idéal pour régler le rythme et l’habillage.</p><button class="btn primary" onclick="go('rehearsal-camera-off-desktop')">Lancer le test rapide ${icons.arrow}</button></article>
            <article class="card mode"><span class="mode-icon">${icons.users}</span><h2>Avec mes joueurs</h2><p>Invitez vos participants sur leur téléphone et répétez ensemble, comme le jour du direct.</p><button class="btn ghost" onclick="go('rehearsal-lobby-handoff')">Inviter mes joueurs ${icons.arrow}</button></article>
          </div>
          <div class="prep-strip">
            <div class="prep-item"><small>Préparation</small><strong><span class="status-dot"></span>3 manches prêtes</strong></div>
            <div class="prep-item"><small>Habillage TV</small><strong><span class="status-dot"></span>Disponible</strong></div>
            <div class="prep-item"><small>Images</small><strong><span class="status-dot"></span>4 disponibles</strong></div>
            <div class="prep-item"><small>Diffusion</small><strong><span class="status-dot pending"></span>À vérifier</strong></div>
          </div>
        `, 'narrow');
      }

      function check(label, state='done') {
        const symbol = state === 'done' ? icons.check : state === 'warning' ? icons.alert : icons.arrow;
        return `<div class="check ${state}"><span class="check-icon">${symbol}</span><span>${label}</span></div>`;
      }

      function liveLobbyHandoff() {
        return shell(`
          ${back('Ma partie Undercover')}
          <section class="card center-card">
            <span class="signal success">${icons.users}</span>
            <span class="eyebrow">Jouer maintenant</span>
            <h1>Ouvrir le salon de jeu</h1>
            <p class="lead">Invitez vos joueurs et préparez votre vraie partie. La répétition ne sera pas lancée.</p>
            <div class="preserved">L’ouverture du salon ne démarre pas encore la première manche.</div>
            <div class="actions"><button class="btn primary" onclick="go('partie-ready-desktop')">Retour à ma partie ${icons.arrow}</button></div>
          </section>
        `, 'narrow');
      }

      function rehearsalLobbyHandoff() {
        return shell(`
          ${back('Choix du mode')}
          <section class="card center-card">
            <span class="signal success">${icons.users}</span>
            <span class="eyebrow">Répétition avec joueurs</span>
            <h1>Inviter mes joueurs</h1>
            <p class="lead">Partagez le code du salon, puis lancez la répétition lorsque vos joueurs sont prêts.</p>
            <div class="preserved">Cette session sert uniquement à répéter. Votre vraie partie restera intacte.</div>
            <div class="actions"><button class="btn primary" onclick="go('rehearsal-camera-off-desktop')">Continuer après l’invitation ${icons.arrow}</button><button class="btn ghost" onclick="go('mode-choice-desktop')">Retour au choix</button></div>
          </section>
        `, 'narrow');
      }

      function rehearsal(kind) {
        const camera = kind === 'discussion' || kind === 'vote';
        const noCamera = kind === 'discussion-no-camera' || kind === 'vote-no-camera';
        const vote = kind === 'vote' || kind === 'vote-no-camera';
        const phase = vote ? 'Vote' : 'Discussion';
        return `<div class="scene-shell">
          <header class="scene-nav"><div class="title"><span class="live-tag"><span class="dot"></span>Répétition</span><span>Ma partie Undercover</span></div><div class="actions"><button class="btn small ghost">Aide</button><span class="avatar">CB</span></div></header>
          <main class="scene-layout">
            <section class="stage-area">
              <div class="stage ${camera ? 'with-camera' : ''}">
                ${camera ? '<img class="camera-feed" src="assets/camera-feed.png" alt="Caméra fictive du studio" />' : noCamera ? `<div class="camera-empty"><div><span class="empty-orb">${icons.camera}</span><h2>Répétition sans caméra</h2><p>L’habillage public reste actif pendant que vous vérifiez le parcours.</p></div></div>` : `<div class="camera-empty"><div><span class="empty-orb">${icons.camera}</span><h2>Caméra inactive</h2><p>Voyez l’habillage directement sur votre image, comme pendant l’émission.</p><button class="btn primary" onclick="go('rehearsal-discussion-desktop')">Activer ma caméra</button></div></div>`}
                <div class="overlay">
                  <div class="broadcast-bar"><strong>UNDERCOVER</strong><span class="sep"></span><span>${phase}</span><span class="sep"></span><span>${vote ? 'Manche 1' : 'Tour 1/2'}</span></div>
                  <div class="player-count">${icons.users}<span>3 joueurs</span></div>
                  ${(camera || noCamera) && !vote ? `<div class="active-player"><span class="pulse"></span><span>À Sam de donner un indice</span></div><div class="duo"><div class="duo-card"><span>Sasuke</span></div><span class="vs">VS</span><div class="duo-card red"><span>Itachi</span></div></div>` : ''}
                  ${(camera || noCamera) && vote ? `<div class="vote-panel"><div class="vote-head"><strong>Le vote est ouvert</strong><span>2 sur 3 ont voté</span></div><div class="vote-people"><span class="vote-person">Sam</span><span class="vote-person">Lina</span><span class="vote-person">Alex</span></div></div>` : ''}
                </div>
              </div>
              <div class="scene-caption"><span class="sync">Régie et habillage synchronisés</span><span>${camera ? 'Caméra active sur cet appareil' : noCamera ? 'Répétition sans caméra' : 'La caméra reste facultative'}</span></div>
            </section>
            <aside class="rail">
              <div><h2>Votre répétition</h2><p>Avancez à votre rythme et vérifiez ce qui compte pour vous.</p></div>
              <div class="checklist">
                ${check('Préparation chargée')}
                ${check(camera ? 'Caméra visible' : noCamera ? 'Sans caméra' : 'Tester ma caméra', camera ? 'done' : noCamera ? 'warning' : 'pending')}
                ${check(vote ? 'Discussion vérifiée' : 'Voir la discussion', vote ? 'done' : 'pending')}
                ${check(vote ? 'Vote affiché' : 'Voir le vote', vote ? 'done' : 'pending')}
                ${check('Tester une transition', 'pending')}
              </div>
              <div class="view-links"><a class="view-link" href="#"><span>Ouvrir la régie</span>${icons.arrow}</a><a class="view-link" href="#"><span>Voir comme un joueur</span>${icons.arrow}</a><a class="view-link" href="#"><span>Voir comme un spectateur</span>${icons.arrow}</a></div>
              <div class="rail-actions">
                ${kind === 'camera-off' ? `<button class="btn ghost" onclick="go('rehearsal-discussion-no-camera-desktop')">Continuer sans caméra</button>` : kind === 'discussion' ? `<button class="btn primary" onclick="go('rehearsal-vote-desktop')">Passer au vote ${icons.arrow}</button>` : kind === 'discussion-no-camera' ? `<button class="btn primary" onclick="go('rehearsal-vote-no-camera-desktop')">Passer au vote ${icons.arrow}</button>` : `<button class="btn primary" onclick="go('rehearsal-complete-desktop')">Terminer la répétition</button>`}
                <button class="btn linkish" onclick="go('partie-ready-desktop')">Quitter la répétition</button>
              </div>
            </aside>
          </main>
        </div>`;
      }

      function issue() {
        return shell(`
          ${back('Répétition')}
          <section class="card center-card">
            <span class="signal">${icons.alert}</span>
            <span class="eyebrow">Un point à vérifier</span>
            <h1>La caméra n’est pas disponible</h1>
            <p class="lead">La répétition peut continuer avec l’habillage seul. Vous pourrez réessayer quand vous voudrez.</p>
            <div class="issue-row"><div><strong>Accès à la caméra</strong><small>Vérifiez l’autorisation donnée à votre navigateur</small></div><button class="btn small ghost" onclick="go('rehearsal-camera-off-desktop')">Réessayer</button></div>
            <div class="actions"><button class="btn primary" onclick="go('rehearsal-discussion-no-camera-desktop')">Continuer sans caméra</button><button class="btn ghost" onclick="go('partie-ready-desktop')">Revenir à la préparation</button></div>
          </section>
        `, 'narrow');
      }

      function complete() {
        const next = mobileScreens.has(screen) ? 'partie-ready-mobile' : 'partie-ready-desktop';
        return shell(`
          ${back('Répétition')}
          <section class="card center-card">
            <span class="signal success">${icons.check}</span>
            <span class="eyebrow"><span class="dot"></span>Répétition terminée</span>
            <h1>Tout est prêt pour votre émission</h1>
            <p class="lead">Vous avez vérifié le parcours principal dans les conditions du direct.</p>
            <div class="complete-grid">
              <div class="complete-item">${icons.check}<span>Régie synchronisée</span></div>
              <div class="complete-item">${icons.check}<span>Habillage TV lisible</span></div>
              <div class="complete-item">${icons.check}<span>Discussion vérifiée</span></div>
              <div class="complete-item">${icons.check}<span>Vote vérifié</span></div>
            </div>
            <div class="preserved">Votre série est intacte. Aucune manche n’a été consommée pendant la répétition.</div>
            <div class="actions"><button class="btn primary" onclick="go('${next}')">Retour à ma partie ${icons.arrow}</button><button class="btn ghost">Voir le récapitulatif</button></div>
          </section>
        `, 'narrow');
      }

      function twitch(connected) {
        return `<div class="mobile-wrap">
          <header class="mobile-bar">${brand()}<span class="pill citron">Undercover</span></header>
          <main class="mobile-content">
            ${back('Diffusion')}
            <span class="eyebrow">Mon direct</span>
            <h1>${connected ? 'Twitch est connecté' : 'Connecter Twitch'}</h1>
            <p class="lead">${connected ? 'Votre chaîne est reliée à votre espace diffusion.' : 'Retrouvez plus facilement votre chaîne et l’état de votre direct.'}</p>
            <section class="card status-card">
              <span class="service-icon">${icons.twitch}</span>
              ${connected ? `<h2>Chaîne connectée</h2><div class="account"><span class="avatar">CB</span><div><strong>Chloé en direct</strong><small>Connexion active</small></div></div><button class="btn ghost" style="width:100%">Gérer la connexion</button>` : `<h2>Votre chaîne, au même endroit</h2><p>Connectez votre compte streamer en quelques secondes.</p><button class="btn primary" style="width:100%;margin-top:8px">Continuer avec Twitch</button>`}
            </section>
            <div class="mini-features"><div class="mini-feature">${icons.shield}<span>La répétition avant direct reste disponible, même sans Twitch.</span></div><div class="mini-feature">${icons.cast}<span>Vos réglages de diffusion restent séparés de votre préparation de jeu.</span></div></div>
            ${!connected ? '<p class="fineprint">Vous pourrez déconnecter votre compte à tout moment.</p>' : ''}
          </main>
          <footer class="mobile-bottom"><button class="btn ${connected ? 'primary' : 'ghost'}" onclick="go('mode-choice-mobile')">${connected ? 'Continuer' : 'Plus tard'}</button></footer>
        </div>`;
      }

      const routes = {
        'partie-ready-desktop': ready,
        'partie-ready-mobile': ready,
        'mode-choice-desktop': modeChoice,
        'mode-choice-mobile': modeChoice,
        'live-lobby-handoff': liveLobbyHandoff,
        'rehearsal-lobby-handoff': rehearsalLobbyHandoff,
        'rehearsal-camera-off-desktop': () => rehearsal('camera-off'),
        'rehearsal-discussion-desktop': () => rehearsal('discussion'),
        'rehearsal-discussion-no-camera-desktop': () => rehearsal('discussion-no-camera'),
        'rehearsal-vote-desktop': () => rehearsal('vote'),
        'rehearsal-vote-no-camera-desktop': () => rehearsal('vote-no-camera'),
        'rehearsal-issue-desktop': issue,
        'rehearsal-complete-desktop': complete,
        'rehearsal-complete-mobile': complete,
        'twitch-disconnected-mobile': () => twitch(false),
        'twitch-connected-mobile': () => twitch(true)
      };
      document.getElementById('root').innerHTML = (routes[screen] || ready)();
    </script>
  </body>
</html>
